name: Auto-update schedule from gtifem.ru

# Пользователь явно подтвердил вариант "A. Auto-push каждые 6 ч"
# (см. историю чата от 02.06.2026). Workflow:
#  1. Скачивает свежие HTML-страницы расписания с gtifem.ru
#  2. Перепарсивает их в ICS-файлы
#  3. Если что-то изменилось — коммитит и пушит
# Подписчики Apple/Google Calendar получают обновления автоматически.

on:
  schedule:
    # Каждые 6 часов в 5 минут (HH:05)
    - cron: "5 */6 * * *"
  # Ручной запуск из вкладки Actions
  workflow_dispatch:

# Только один запуск одновременно, отменяет предыдущий незавершённый
concurrency:
  group: schedule-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download fresh schedule from gtifem.ru
        run: |
          mkdir -p _tmp_html
          node .github/scripts/fetch_gtifem.mjs \
            --out-dir _tmp_html \
            --teachers-list api/schedule/teachers.json \
            --groups-list api/schedule/groups.json

      - name: Re-parse and rebuild ICS (with safe merge by UID)
        run: |
          node .github/scripts/rebuild_ics.mjs \
            --html-dir _tmp_html \
            --teachers-out api/schedule/teacher \
            --groups-out api/schedule/group

      - name: Refresh JSON indexes
        run: node .github/scripts/rebuild_indexes.mjs

      - name: Cleanup temp files
        run: rm -rf _tmp_html

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "auto: refresh schedule from gtifem.ru ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
            echo "✓ Pushed changes"
          else
            echo "✓ No changes to push"
          fi
